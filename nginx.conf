# Rate limiting zone for API and webhooks (10MB of IP storage, rate 5 requests per second)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SEO sitemap compatibility
    rewrite ^/sitemap_index\.xml$ /sitemap.xml last;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Redirigir tráfico HTTP a HTTPS si viene del proxy
        if ($http_x_forwarded_proto = "http") {
            return 301 https://$host$request_uri;
        }

        # Security Headers
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        
        # Content Security Policy - Actualizado para permitir el proxy local y fuentes externas
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://r2cdn.perplexity.ai; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    }

    # Reverse proxy for N8N webhooks
    location /webhook/ {
        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;

        # Simple CORS logic for proxied requests
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Forward request to the actual backend
        proxy_pass https://tallerisidro-n8n.6shxj1.easypanel.host/webhook/;
        proxy_set_header Host tallerisidro-n8n.6shxj1.easypanel.host;
        proxy_ssl_server_name on;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Importante para que n8n reciba correctamente la auth
        proxy_pass_header Authorization;
        proxy_pass_request_headers on;
    }

    # Cache static assets but allow revalidation
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4)$ {
        root /usr/share/nginx/html;
        expires 0;
        add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
