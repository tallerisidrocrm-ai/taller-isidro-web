# Rate limiting zone for API and webhooks (10MB of IP storage, rate 5 requests per second)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SEO sitemap compatibility
    rewrite ^/sitemap_index\.xml$ /sitemap.xml last;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Security Headers
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Content Security Policy - Relaxed for debugging
        add_header Content-Security-Policy "default-src 'self' *; script-src 'self' 'unsafe-inline' 'unsafe-eval' *; style-src 'self' 'unsafe-inline' *; font-src 'self' data: *; img-src 'self' data: *; connect-src 'self' *; frame-ancestors 'none'; base-uri 'self';" always;
    }

    # Reverse proxy para N8N webhooks
    location /webhook/ {
        # Rate limiting
        limit_req zone=api_limit burst=10 nodelay;

        # Validar el origen para CORS estricto
        set $cors_origin "";
        if ($http_origin ~* "^https?://(.*\.)?tallerisidro\.cloud$") {
            set $cors_origin $http_origin;
        }

        # CORS options
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Forward request to the actual backend
        proxy_pass https://tallerisidro-n8n.6shxj1.easypanel.host/webhook/;
        proxy_set_header Host tallerisidro-n8n.6shxj1.easypanel.host;
        proxy_ssl_server_name on;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ocultar autorización del frontend y forzar la de n8n
        # Nginx inyectará este header para comunicarse con n8n de forma segura
        # tis-k8x7m2p4q9w1n6v3j5 (base64)
        proxy_set_header Authorization "Basic dGFsbGVyaXNpZHJvOnRpcy1rOHg3bTJwNHE5dzFuNnYzajU=";
        proxy_pass_request_headers on;
    }

    # Cache static assets but allow revalidation
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|mp4)$ {
        root /usr/share/nginx/html;
        expires 0;
        add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
